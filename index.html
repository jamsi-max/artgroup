<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Required</title>
  <style>
    :root {
      --main-bg: #f2f1fa;
      --card-bg: #fff;
      --accent: #bde0fe;
      --accent2: #cdb4db;
      --accent3: #a3c9a8;
      --coin1: #fff9bc;
      --coin2: #f6f3b8;
      --coin3: #f9efd3;
      --text-main: #594a4e;
      --shadow: 0 4px 24px 0 rgba(180, 180, 200, 0.08);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: var(--main-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    }
    .container {
      background: var(--card-bg);
      box-shadow: var(--shadow);
      border-radius: 2rem;
      padding: 2rem 2rem 2rem;
      max-width: 400px;
      width: 96vw;
      min-height: 275px;
      margin: 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      justify-content: flex-start;
      transition: box-shadow 0.2s;
    }
    .message {
      color: var(--text-main);
      font-size: 1.22rem;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
      margin-top: 1.1rem;
    }
    @media (max-width: 600px) {
      .container {
        padding: 1.3rem 0.4rem 1.3rem;
        border-radius: 1.2rem;
        max-width: 99vw;
        min-height: 170px;
      }
      .message {
        font-size: 1rem;
      }
    }
    .svg-anim {
      max-width: 210px;
      width: 85vw;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Only coins animate */
    .anim-coins {
      transform-origin: 134px 89px;
      animation: coinsBounce 2.1s ease-in-out infinite alternate;
    }
    @keyframes coinsBounce {
      0% { transform: translateY(0) scale(1);}
      100% { transform: translateY(5px) scale(1.02);}
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SVG illustration with only coins animated and pastel yellow color -->
    <svg class="svg-anim" viewBox="0 0 170 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Soft card shadow -->
      <rect x="16" y="44" width="138" height="60" rx="13" fill="#cdb4db" fill-opacity="0.22"/>
      <rect x="24" y="34" width="122" height="72" rx="14" fill="#bde0fe" fill-opacity="0.38"/>
      <!-- Main card (static) -->
      <rect x="32" y="26" width="106" height="88" rx="16" fill="#fff" stroke="#bde0fe" stroke-width="2"/>
      <!-- Card chip (static) -->
      <rect x="44" y="46" width="22" height="9" rx="2.5" fill="#bde0fe" fill-opacity="0.64"/>
      <!-- Coin stack animation group (pastel yellow) -->
      <g class="anim-coins">
        <ellipse cx="134" cy="115" rx="15" ry="6" fill="var(--coin3)" />
        <ellipse cx="134" cy="109" rx="15" ry="6" fill="var(--coin1)" />
        <ellipse cx="134" cy="103" rx="15" ry="6" fill="var(--coin2)" />
      </g>
      <!-- Lock (static) -->
      <g>
        <rect x="84.5" y="61" width="19" height="20" rx="5" fill="#bde0fe" fill-opacity="0.65"/>
        <rect x="89" y="71" width="10" height="7" rx="3.3" fill="#fff"/>
        <rect x="92" y="65" width="4" height="8" rx="2" fill="#fffdfa"/>
      </g>
    </svg>
    <div class="message">
      To continue using the service, you must pay according to the tariff.
    </div>
  </div>
</body>
</html>
